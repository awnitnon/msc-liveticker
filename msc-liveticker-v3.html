<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092a22"><title>MSC Liveticker · Version 3</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#132821;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:520px;margin:auto;min-height:100dvh;background:#f7f9f8;padding-bottom:calc(94px + env(safe-area-inset-bottom))}.header{background:#092e25;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.crest{width:43px;height:43px;border-radius:14px;background:#e6bf5c;color:#183b30;display:grid;place-items:center;font-weight:900;letter-spacing:-1px}.brand small{display:block;opacity:.65;font-size:11px;letter-spacing:1.4px;font-weight:700}.brand strong{font-size:20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#71857c;font-weight:800}.content{padding:18px 16px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.section-title h2{font-size:20px;margin:0;letter-spacing:-.4px}.card{background:#fff;border:1px solid #e1e9e4;box-shadow:0 2px 12px #12342506;border-radius:17px;padding:16px;margin:0 0 13px}.muted{color:#6b8075;font-size:13px}.bigbtn{border:0;background:#086b4b;color:white;font-weight:750;border-radius:13px;padding:15px;min-height:50px;width:100%}.secondary{background:#ecf3ef;color:#155540}.outline{background:white;color:#155540;border:1px solid #ccded3}.danger{background:#fff0ed;color:#a23e31}.btnrow{display:flex;gap:9px}.btnrow>*{flex:1}.field{display:block;margin:12px 0 4px;font-weight:700;font-size:13px;color:#324940}input,select,textarea{width:100%;padding:13px;background:white;color:#1b342b;border:1px solid #cfded4;border-radius:11px;min-height:47px;outline:none}input:focus,select:focus,textarea:focus{border-color:#048156;box-shadow:0 0 0 3px #07845618}textarea{min-height:85px;resize:vertical}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #dce6df;padding:8px 7px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:transparent;color:#77887e;padding:6px 3px;border-radius:10px;font-size:10px;font-weight:750}.nav button b{font-size:21px;display:block;margin-bottom:2px}.nav button.active{color:#08734e;background:#eff7f2}.hidden{display:none!important}.matchline{display:flex;justify-content:space-between;align-items:center;gap:10px}.score{font-size:35px;font-weight:850;letter-spacing:-1px}.pill{display:inline-block;background:#e5f4eb;color:#067c49;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:800}.pill.orange{background:#fff2da;color:#9c6a0c}.timer{text-align:center;margin:10px 0 14px}.timer strong{font-variant-numeric:tabular-nums;font-size:53px;font-weight:850;letter-spacing:-2px}.timer small{display:block;color:#72877a}.eventgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.eventbtn{border:1px solid #dfe9e2;border-radius:13px;min-height:83px;background:white;padding:10px 4px;font-size:12px;font-weight:750}.eventbtn b{display:block;font-size:24px;margin:0 0 5px}.eventbtn.selected{border:2px solid #087b54;background:#eff9f2}.player{display:flex;gap:11px;align-items:center;padding:11px 2px;border-bottom:1px solid #edf1ee}.player:last-child{border:0}.jersey{border-radius:10px;display:grid;place-items:center;width:37px;height:38px;flex:none;background:#e9f3eb;color:#106347;font-size:15px;font-weight:850}.grow{flex:1;min-width:0}.playername{font-weight:750}.microbtn{border:1px solid #d8e6dd;background:#f6f9f7;border-radius:9px;padding:9px 11px;color:#17684c;font-size:12px;font-weight:750}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.picklist{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pick{border:1px solid #dfe7e1;background:white;text-align:left;border-radius:12px;padding:11px;font-weight:650;min-height:47px}.pick.sel{border:2px solid #0e8158;background:#e9f7ee}.pick .mini{color:#648174;font-size:11px;display:block}.timeline{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #eaf0eb}.timeline:last-child{border:0}.minute{background:#eaf5ed;color:#136745;font-weight:800;font-size:12px;padding:9px 5px;border-radius:10px;min-width:44px;text-align:center;height:fit-content}.timeline p{margin:5px 0 0;color:#667a6f;font-size:12px;white-space:pre-line}.empty{text-align:center;color:#718478;padding:24px 14px}.empty b{display:block;font-size:30px;margin:0 0 8px}.status{color:#526c5d;font-size:12px;text-align:center;margin-top:11px}.switch{display:flex;background:#edf3ef;border-radius:12px;padding:4px;gap:4px}.switch button{flex:1;border:0;background:none;border-radius:9px;padding:10px;font-weight:750;color:#637d6a}.switch button.selected{background:white;box-shadow:0 1px 6px #102a2014;color:#086b4b}.help{background:#eef8ef;border:1px solid #d2e8d8;padding:12px;border-radius:11px;color:#37654d;font-size:12px;line-height:1.5}.headerline{margin:18px 0 8px;font-weight:800}.feedback{position:fixed;bottom:calc(89px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#123f2c;color:#fff;padding:12px 19px;border-radius:14px;z-index:40;box-shadow:0 6px 25px #0002;font-size:13px;max-width:90%;text-align:center}.space{height:10px}.tiny{font-size:11px;color:#789082}.tag{font-size:11px;border-radius:8px;padding:4px 7px;background:#eef4ef;color:#4a7460}.toplink{background:none;border:0;color:#e5bb54;font-weight:700;padding:8px}.boxcheck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1ed}.boxcheck input{height:21px;min-height:21px;width:21px;accent-color:#087b54}.divider{height:1px;background:#e7eee9;margin:16px 0}@media(min-width:600px){body{background:#dce8df}.app{box-shadow:0 0 50px #1c3a2420}}

.wizard-progress{display:flex;gap:5px;margin:4px 0 13px}.wizard-progress span{flex:1;text-align:center;border-radius:9px;background:#e8efea;color:#6b8174;font-size:11px;font-weight:800;padding:10px 2px}.wizard-progress span.now{background:#09714f;color:white}.wizard-card{padding:17px}.wizard-heading{font-size:21px;line-height:1.2;font-weight:850;letter-spacing:-.5px;margin:3px 0 9px}.wizard-choice{width:100%;display:flex;align-items:center;gap:13px;border:1px solid #dae7dd;background:#fff;color:#183c2e;border-radius:14px;min-height:65px;padding:12px;margin:9px 0;text-align:left;font-weight:750;font-size:16px}.wizard-choice.large{min-height:90px;font-size:17px}.wizard-choice:active{background:#eaf7ee;border-color:#08754f}.wizard-chevron{color:#08754f;font-size:27px;font-weight:400}.teammark{background:#0c684c;color:white;border-radius:12px;padding:12px 9px;font-size:13px;min-width:56px;text-align:center;font-weight:850}.teammark.away{background:#e9efe9;color:#466456}.wizard-subhead{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#657f70;font-weight:850;margin:18px 0 7px}.review-row{border-bottom:1px solid #e9efeb;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;font-size:14px}.review-row span{color:#698172}.review-row b{text-align:right;overflow-wrap:anywhere}.switch button{font-size:12px;line-height:1.35} .switch button.selected{color:#086b4b}
</style></head><body><div class="app"><header class="header"><div class="brand"><div class="crest">MSC</div><div style="flex:1"><small>1. MANNSCHAFT</small><strong>MSC Liveticker</strong></div><button id="headerHelp" class="toplink" onclick="help()">Hilfe ?</button></div></header><main class="content" id="main"></main><nav class="nav" id="nav"></nav></div><div id="toast" class="feedback hidden"></div><script>
'use strict';const KEY='msc-ticker-demo-v1';const EVENT_TYPES=[['Kommentar','💬'],['Highlight','🔥'],['Tor','⚽'],['Wechsel','🔄'],['Gelbe Karte','🟨'],['Gelb-Rot','🟨🟥'],['Rote Karte','🟥'],['Foul','⚠️'],['Ecke','🚩'],['Freistoß','🎯'],['Torschuss','🥅'],['Elfmeter','🥅'],['Elfmetertor','⚽'],['Eigentor','↩️'],['Abseits','🚫']];const seed={roster:[{id:'p1',name:'Max Müller',number:'9'},{id:'p2',name:'Lukas Schmidt',number:'6'},{id:'p3',name:'Tom Weber',number:'10'}],games:[],active:null};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){data=structuredClone(seed)}let view='home',draft=null,eventDraft=null,eventStep=1,selectedGame=null,editingPlayer=null,toastTimer=null;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(s){document.getElementById('main').innerHTML=s}function notice(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}function go(x){view=x;render();window.scrollTo({top:0,behavior:'instant'})}function nav(){document.getElementById('nav').innerHTML=[['home','⌂','Übersicht'],['game','◉','Liveticker'],['new','＋','Neues Spiel'],['roster','♙','Kader']].map(([id,ic,n])=>`<button class="${(id===view||(view==='event'&&id==='game')||(view==='lineup'&&id==='new'))?'active':''}" onclick="go('${id}')"><b>${ic}</b>${n}</button>`).join('')}function game(){return data.games.find(x=>x.id===(selectedGame||data.active))}function teamName(g,team){return team==='msc'?'MSC':g.opponent}function isHome(g,team){return(g.home&&team==='msc')||(!g.home&&team==='opp')}function shownScore(g){let a=0,b=0;for(const e of g.events){if(['Tor','Elfmetertor','Eigentor'].includes(e.type)){const scoring=e.type==='Eigentor'?(e.team==='msc'?'opp':'msc'):e.team;if(scoring==='msc')a++;else b++}}return g.home?`${a} : ${b}`:`${b} : ${a}`}function goalScore(g){let a=0,b=0;for(const e of g.events)if(['Tor','Elfmetertor','Eigentor'].includes(e.type)){const scoring=e.type==='Eigentor'?(e.team==='msc'?'opp':'msc'):e.team;scoring==='msc'?a++:b++}return {a,b}}function mscScore(g){const {a,b}=goalScore(g);return g.home?`${a}:${b}`:`${b}:${a}`}function clockSeconds(g){return (g.clock.base||0)+(g.clock.running?Math.floor((Date.now()-g.clock.since)/1000):0)}function fmtClock(n){let m=Math.floor(Math.max(0,n)/60),s=Math.floor(Math.max(0,n)%60);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function currentMin(g){return Math.max(1,Math.ceil(clockSeconds(g)/60))}function minuteValue(g){return String(currentMin(g))}function rosterPlayer(id){return data.roster.find(p=>p.id===id)}function playerFromGame(g,id){return g.players.find(p=>p.id===id)}function currentOnField(g){const on=new Set(g.starters);const evs=[...g.events].sort((a,b)=>a.order-b.order);for(const e of evs){if(e.type==='Wechsel'&&e.team==='msc'&&e.player&&e.inPlayer){on.delete(e.player);on.add(e.inPlayer)}}return [...on]}function played(g,id){return currentOnField(g).includes(id)}function cloneRoster(ids){return ids.map(id=>{const p=rosterPlayer(id);return p?{...p}:{id,name:'Unbekannt',number:''}})}function render(){nav();if(view==='home')home();if(view==='roster')roster();if(view==='new')newGame();if(view==='lineup')lineup();if(view==='game')gameView();if(view==='event')eventView()}function home(){const active=game();el(`<div class="section-title"><h2>Spielzentrale</h2><span class="pill">Prototyp</span></div><div class="card"><div class="eyebrow">${active?'Ausgewähltes Spiel':'Bereit für den Anpfiff'}</div>${active?`<div class="matchline" style="margin:13px 0"><div><b>MSC ${active.home?'–':'bei'} ${esc(active.opponent)}</b><div class="muted">${esc(active.date||'')} · ${esc(active.state)}</div></div><b class="score">${shownScore(active)}</b></div><button class="bigbtn" onclick="go('game')">Spiel öffnen →</button>`:`<h2 style="margin:9px 0 16px">Dein nächstes Spiel</h2><button class="bigbtn" onclick="go('new')">＋ Neues Ticker-Spiel anlegen</button>`}</div><div class="card"><b>So funktioniert's</b><p class="muted" style="line-height:1.65">① Kader einmalig pflegen<br>② Gegner und Startelf festlegen<br>③ Spiel starten und Ereignisse antippen<br>④ WhatsApp-Text kopieren und im Kanal posten</p><div class="help">⚠️ Diese Testversion speichert Daten nur in diesem Browser auf diesem Gerät. Für die spätere Vereinsversion benötigen wir eine zentrale Online-Datenbank.</div></div><div class="section-title"><h2>Spielarchiv</h2><span class="tag">${data.games.length} Spiele</span></div>${data.games.length?data.games.slice().reverse().map(g=>`<div class="card"><div class="matchline"><div><b>MSC ${g.home?'–':'bei'} ${esc(g.opponent)}</b><div class="muted">${esc(g.date||'')} · ${esc(g.state)} · ${g.events.length} Ereignisse</div></div><b>${shownScore(g)}</b></div><button class="microbtn" style="margin-top:12px;width:100%" onclick="selectGame('${g.id}')">Spiel öffnen</button></div>`).join(''):`<div class="empty"><b>📋</b>Noch keine Spiele vorhanden.</div>`}`)}function selectGame(id){selectedGame=id;data.active=id;save();go('game')}function roster(){el(`<div class="section-title"><h2>MSC-Kader</h2><span class="tag">${data.roster.length} Spieler</span></div><div class="card"><div class="muted">Einmalig hinterlegen – beim Erstellen eines Spiels auswählen.</div>${data.roster.map(p=>`<div class="player"><span class="jersey">${esc(p.number||'–')}</span><div class="grow playername">${esc(p.name)}</div><button class="microbtn" onclick="editPlayer('${p.id}')">Ändern</button><button class="microbtn" onclick="removePlayer('${p.id}')">✕</button></div>`).join('')||'<p class="muted">Noch keine Spieler angelegt.</p>'}</div><div class="card"><b id="rosterTitle">Neuen Spieler hinzufügen</b><label class="field">Name</label><input id="pname" placeholder="Vor- und Nachname" autocomplete="off"><label class="field">Rückennummer</label><input id="pnumber" inputmode="numeric" placeholder="z. B. 9"><div class="space"></div><button class="bigbtn" onclick="savePlayer()" id="savep">＋ Spieler speichern</button><button class="bigbtn secondary hidden" style="margin-top:8px" id="cancelp" onclick="editingPlayer=null;roster()">Abbrechen</button></div>`)}function editPlayer(id){const p=rosterPlayer(id);if(!p)return;editingPlayer=id;document.getElementById('pname').value=p.name;document.getElementById('pnumber').value=p.number;document.getElementById('rosterTitle').textContent='Spieler bearbeiten';document.getElementById('savep').textContent='Änderungen speichern';document.getElementById('cancelp').classList.remove('hidden');document.getElementById('pname').focus()}function savePlayer(){const name=document.getElementById('pname').value.trim(),number=document.getElementById('pnumber').value.trim();if(!name)return notice('Bitte einen Spielernamen eingeben');if(editingPlayer){Object.assign(rosterPlayer(editingPlayer),{name,number})}else data.roster.push({id:uid(),name,number});editingPlayer=null;save();roster();notice('Spieler gespeichert')}function removePlayer(id){if(!confirm('Spieler aus dem aktuellen Kader entfernen? Bereits angelegte Spiele bleiben unverändert.'))return;data.roster=data.roster.filter(p=>p.id!==id);save();roster();notice('Spieler entfernt')}
function newGame(){draft={opponent:'',date:new Date().toISOString().slice(0,10),home:true,selected:[],teamSize:11};el(`<div class="section-title"><h2>Neues Spiel</h2></div><div class="card"><div class="eyebrow">Schritt 1 von 2</div><label class="field">Gegner</label><input id="opp" placeholder="z. B. FC Beispielstadt" autocomplete="off"><label class="field">Datum</label><input type="date" id="date" value="${draft.date}"><label class="field">Spielform und Halbzeitlänge</label><div class="switch" id="sizeSwitch"><button onclick="chooseSize(9)">9 gegen 9 · 40 Min.</button><button class="selected" onclick="chooseSize(11)">11 gegen 11 · 45 Min.</button></div><label class="field">Wo spielt der MSC?</label><div class="switch" id="homeSwitch"><button class="selected" onclick="chooseHome(true)">🏠 Heim</button><button onclick="chooseHome(false)">🚌 Auswärts</button></div><div class="space"></div><button class="bigbtn" onclick="nextLineup()">Weiter zur Aufstellung →</button></div><div class="help">Die MSC-Spieler bleiben gespeichert. Du musst vor jedem Spiel nur die Startelf und Ersatzbank festlegen.</div>`)}function chooseSize(n){draft.teamSize=n;document.querySelectorAll('#sizeSwitch button').forEach((b,i)=>b.classList.toggle('selected',n===9?i===0:i===1))}function chooseHome(v){draft.home=v;document.querySelectorAll('#homeSwitch button').forEach((b,i)=>b.classList.toggle('selected',v?i===0:i===1))}function nextLineup(){const opponent=document.getElementById('opp').value.trim();if(!opponent)return notice('Bitte den Gegner eingeben');draft.opponent=opponent;draft.date=document.getElementById('date').value;draft.selected=[];go('lineup')}function lineup(){el(`<div class="section-title"><h2>Aufstellung</h2><span class="pill" id="pickedCount">0 / ${draft.teamSize} Startaufstellung</span></div><div class="card"><div class="eyebrow">Schritt 2 von 2</div><p class="muted">Tippe auf die Spieler. Die ersten ${draft.teamSize} werden als Startaufstellung gewählt; weitere markierte Spieler gehören auf die Ersatzbank. Erneutes Tippen entfernt sie.</p><div id="lineplayers">${linePlayersHtml()}</div></div><div class="card"><div id="lineSummary" class="muted"></div><div class="space"></div><button class="bigbtn" onclick="createGame()">Spiel anlegen ✓</button></div>`);lineRefresh()}function linePlayersHtml(){return data.roster.map(p=>`<button class="pick ${draft.selected.includes(p.id)?'sel':''}" style="width:100%;margin-bottom:7px;display:flex;align-items:center;gap:10px" onclick="toggleLine('${p.id}')"><span class="jersey">${esc(p.number||'–')}</span><span style="flex:1;text-align:left">${esc(p.name)}</span><span class="tag">${draft.selected.includes(p.id)?(draft.selected.indexOf(p.id)<draft.teamSize?'Startelf':'Bank'):'Auswahl'}</span></button>`).join('')}function toggleLine(id){draft.selected=draft.selected.includes(id)?draft.selected.filter(x=>x!==id):[...draft.selected,id];lineRefresh()}function lineRefresh(){document.getElementById('lineplayers').innerHTML=linePlayersHtml();document.getElementById('pickedCount').textContent=`${Math.min(draft.teamSize,draft.selected.length)} / ${draft.teamSize} Startelf`;document.getElementById('lineSummary').textContent=`Startelf: ${Math.min(draft.teamSize,draft.selected.length)} · Ersatzbank: ${Math.max(0,draft.selected.length-draft.teamSize)}`}function createGame(){if(draft.selected.length<draft.teamSize)return notice('Bitte mindestens '+draft.teamSize+' Spieler auswählen');const g={id:uid(),opponent:draft.opponent,date:draft.date,home:draft.home,teamSize:draft.teamSize,halfMinutes:draft.teamSize===9?40:45,players:cloneRoster(draft.selected),starters:draft.selected.slice(0,draft.teamSize),bench:draft.selected.slice(draft.teamSize),state:'Vorbereitung',clock:{base:0,since:0,running:false},events:[],order:0};data.games.push(g);data.active=g.id;selectedGame=g.id;save();go('game');notice('Spiel angelegt')}
function gameView(){const g=game();if(!g)return el(`<div class="empty"><b>⚽</b>Kein Spiel ausgewählt.<div class="space"></div><button class="bigbtn" onclick="go('new')">Neues Spiel erstellen</button></div>`);const running=g.clock.running;el(`<div class="card"><div class="eyebrow" style="text-align:center">${esc(g.date)} · ${g.home?'Heimspiel':'Auswärtsspiel'} · ${g.teamSize||11} gegen ${g.teamSize||11} · ${g.halfMinutes||45} Min./Halbzeit</div><div class="matchline" style="text-align:center;margin:15px 0"><div style="flex:1"><b>${g.home?'MSC':esc(g.opponent)}</b></div><div class="score" id="score">${shownScore(g)}</div><div style="flex:1"><b>${g.home?esc(g.opponent):'MSC'}</b></div></div><div style="text-align:center"><span class="pill ${g.state==='Halbzeit'?'orange':''}">${esc(g.state)}</span></div><div class="timer"><strong id="clock">${fmtClock(clockSeconds(g))}</strong><small>${running?'● Uhr läuft':'Ⅱ Uhr angehalten'}</small></div><div class="btnrow">${g.state==='Vorbereitung'?`<button class="bigbtn" onclick="startFirst()">▶ 1. Halbzeit starten</button>`:g.state==='Halbzeit'?`<button class="bigbtn" onclick="startSecond()">▶ 2. Halbzeit starten</button>`:g.state==='Beendet'?`<button class="bigbtn secondary" disabled>Spiel beendet</button>`:`<button class="bigbtn ${running?'secondary':''}" onclick="toggleClock()">${running?'Ⅱ Pausieren':'▶ Fortsetzen'}</button><button class="bigbtn outline" onclick="correctClock()">✎ Uhr ändern</button>`}</div>${['1. Halbzeit','2. Halbzeit'].includes(g.state)?`<div class="space"></div><button class="bigbtn outline" onclick="${g.state==='1. Halbzeit'?'finishHalf()':'finishGame()'}">${g.state==='1. Halbzeit'?'⏸ 1. Halbzeit beenden':'🏁 Spiel beenden'}</button>`:''}</div><div class="section-title"><h2>Ereignis melden</h2><span class="tag">${g.events.length} erfasst</span></div><div class="eventgrid">${EVENT_TYPES.map(([n,icon])=>`<button class="eventbtn" onclick="startEvent('${n}')"><b>${icon}</b>${n}</button>`).join('')}</div><div class="space"></div><div class="section-title"><h2>Spielverlauf</h2><button class="microbtn" onclick="copySummary()">Bericht kopieren</button></div><div class="card">${g.events.length?g.events.slice().sort((a,b)=>Number(b.minute)-Number(a.minute)||b.order-a.order).map(e=>`<div class="timeline"><div class="minute">${esc(e.minute)}'</div><div class="grow"><b>${esc(PHASE_ICONS[e.type]||EVENT_TYPES.find(x=>x[0]===e.type)?.[1]||'⚽')} ${esc(e.type)} · ${esc(teamName(g,e.team))}</b><p>${esc(eventDesc(g,e))}</p><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${isPhase(e)?'':`<button class="microbtn" onclick="editEvent('${e.id}')">Bearbeiten</button>`}<button class="microbtn" onclick="copyEvent('${e.id}')">📋 Kopieren</button><button class="microbtn" onclick="deleteEvent('${e.id}')">Löschen</button></div></div></div>`).join(''):`<div class="empty">Noch keine Spielereignisse erfasst.</div>`}</div><div class="help">📣 Anpfiff, Halbzeit, Wiederanpfiff und Abpfiff erzeugen automatisch eine Meldung und versuchen diese direkt zu kopieren. Du findest sie auch im Spielverlauf. Für andere Ereignisse: Ereignis speichern → „Kopieren“ → WhatsApp-Kanal öffnen → einfügen und senden.</div>`)}function tick(){const g=game();if(view==='game'&&g){const x=document.getElementById('clock');if(x)x.textContent=fmtClock(clockSeconds(g))}}setInterval(tick,350);function startFirst(){const g=game();if(g.state!=='Vorbereitung')return;g.state='1. Halbzeit';g.clock={base:0,since:Date.now(),running:true};addPhase(g,'Anpfiff','1');save();gameView();copyPhase(g)}function toggleClock(){const g=game();if(g.clock.running){g.clock.base=clockSeconds(g);g.clock.running=false}else{g.clock.since=Date.now();g.clock.running=true}save();gameView()}function correctClock(){const g=game();const val=prompt('Spieluhr im Format MM:SS (z. B. 14:30)',fmtClock(clockSeconds(g)));if(val===null)return;const match=val.trim().match(/^(\d{1,3}):(\d{1,2})$/);if(!match||+match[2]>=60)return notice('Bitte MM:SS eingeben');g.clock.base=Number(match[1])*60+Number(match[2]);g.clock.since=Date.now();save();gameView();notice('Spieluhr korrigiert')}function finishHalf(){if(!confirm('1. Halbzeit beenden?'))return;const g=game();g.clock.base=clockSeconds(g);g.clock.running=false;g.state='Halbzeit';addPhase(g,'Halbzeit',String(currentMin(g)));save();gameView();copyPhase(g)}function startSecond(){const g=game();if(g.state!=='Halbzeit')return;g.state='2. Halbzeit';g.clock={base:(g.halfMinutes||45)*60,since:Date.now(),running:true};addPhase(g,'Wiederanpfiff',String((g.halfMinutes||45)+1));save();gameView();copyPhase(g)}function finishGame(){if(!confirm('Spiel jetzt beenden?'))return;const g=game();g.clock.base=clockSeconds(g);g.clock.running=false;g.state='Beendet';addPhase(g,'Abpfiff',String(currentMin(g)));save();gameView();copyPhase(g)}
const PHASE_ICONS={'Anpfiff':'▶️','Halbzeit':'⏸️','Wiederanpfiff':'▶️','Abpfiff':'🏁'};
function isPhase(e){return Object.prototype.hasOwnProperty.call(PHASE_ICONS,e.type)}
function addPhase(g,type,minute){const e={id:uid(),type,team:'msc',minute,player:'',inPlayer:'',note:'',order:++g.order};g.events.push(e);return e}
function copyPhase(g){const e=g.events[g.events.length-1];if(e&&isPhase(e))copyText(eventMsg(g,e))}
function phaseScore(g,e){const evs=g.events.filter(x=>x.order<=e.order);return shownScore({...g,events:evs}).replace(/\s/g,'')}
function startEvent(type){const g=game();if(!g)return notice('Bitte zuerst ein Spiel erstellen');eventDraft={id:null,type,team:null,minute:minuteValue(g),player:'',inPlayer:'',note:''};eventStep=1;go('event')}
function editEvent(id){const e=game()?.events.find(x=>x.id===id);if(!e)return;if(isPhase(e))return notice('Spielphasen lassen sich nicht über die Ereignis-Auswahl bearbeiten');eventDraft={...e};eventStep=3;go('event')}
function eventBack(){if(eventStep===1){go('game');return}if(eventStep===3){eventStep=eventDraft.team==='opp'?1:(eventDraft.type==='Wechsel'?25:2)}else if(eventStep===25){eventStep=2}else eventStep=1;eventView()}
function pickEventTeam(team){eventDraft.team=team;eventDraft.player='';eventDraft.inPlayer='';eventStep=team==='msc'?2:3;eventView()}
function pickEventPlayer(id){eventDraft.player=id;if(eventDraft.type==='Wechsel'){eventDraft.inPlayer='';eventStep=25}else eventStep=3;eventView()}
function pickEventIncoming(id){eventDraft.inPlayer=id;eventStep=3;eventView()}
function eventSkipPlayer(){eventDraft.player='';eventStep=3;eventView()}
function eventPlayerRequired(e){return ['Tor','Elfmetertor','Eigentor','Gelbe Karte','Gelb-Rot','Rote Karte','Wechsel'].includes(e.type)}
function eventView(){const g=game();if(!g||!eventDraft)return go('game');const e=eventDraft;const icon=EVENT_TYPES.find(x=>x[0]===e.type)?.[1]||'⚽';const on=currentOnField(g);const starters=on.map(id=>playerFromGame(g,id)).filter(Boolean);const bench=g.bench.filter(id=>!on.includes(id)).map(id=>playerFromGame(g,id)).filter(Boolean);const playerCards=(arr,handler,selected)=>arr.map(p=>`<button class="wizard-choice ${selected===p.id?'sel':''}" onclick="${handler}('${p.id}')"><span class="jersey">${esc(p.number||'–')}</span><span class="grow" style="text-align:left"><b>${esc(p.name)}</b></span><span class="wizard-chevron">›</span></button>`).join('');let body='';
if(eventStep===1){body=`<div class="wizard-heading">Welche Mannschaft?</div><p class="muted">Tippe auf die Mannschaft, die das Ereignis betrifft.</p><button class="wizard-choice large" onclick="pickEventTeam('msc')"><span class="teammark">MSC</span><span class="grow">MSC</span><span class="wizard-chevron">›</span></button><button class="wizard-choice large" onclick="pickEventTeam('opp')"><span class="teammark away">GAST</span><span class="grow">${esc(g.opponent)}</span><span class="wizard-chevron">›</span></button>`}
else if(eventStep===2){const available=e.type==='Wechsel'?starters:[...starters,...bench];body=`<div class="wizard-heading">Welcher MSC-Spieler?</div><p class="muted">${e.type==='Wechsel'?'Wähle zuerst den Spieler, der den Platz verlässt.':'Wähle einen Spieler aus der heutigen Aufstellung.'}</p><div class="wizard-subhead">${e.type==='Wechsel'?'Auf dem Platz':'Spieler auf dem Platz'}</div>${playerCards(starters,'pickEventPlayer',e.player)}${e.type!=='Wechsel'&&bench.length?`<div class="wizard-subhead">Ersatzbank</div>${playerCards(bench,'pickEventPlayer',e.player)}`:''}${!eventPlayerRequired(e)?`<button class="bigbtn outline" style="margin-top:14px" onclick="eventSkipPlayer()">Ohne Spieler weiter →</button>`:''}`}
else if(eventStep===25){body=`<div class="wizard-heading">Wer wird eingewechselt?</div><p class="muted">Wähle den Spieler von der Ersatzbank.</p>${bench.length?playerCards(bench,'pickEventIncoming',e.inPlayer):'<div class="help">Auf der Ersatzbank ist derzeit kein verfügbarer Spieler.</div>'}`}
else{const pname=e.player?playerFromGame(g,e.player):null;const inname=e.inPlayer?playerFromGame(g,e.inPlayer):null;body=`<div class="wizard-heading">Ereignis überprüfen</div><div class="review-row"><span>Mannschaft</span><b>${esc(teamName(g,e.team))}</b></div><div class="review-row"><span>Ereignis</span><b>${icon} ${esc(e.type)}</b></div>${e.team==='msc'?`<div class="review-row"><span>Spieler</span><b>${pname?esc((pname.number?'#'+pname.number+' · ':'')+pname.name):'Kein Spieler'}</b></div>`:''}${e.type==='Wechsel'&&e.team==='msc'?`<div class="review-row"><span>Eingewechselt</span><b>${inname?esc(inname.name):'–'}</b></div>`:''}<label class="field">Spielminute (änderbar)</label><input id="evminute" inputmode="text" value="${esc(e.minute)}" placeholder="z. B. 10 oder 40+2" oninput="eventDraft.minute=this.value"><label class="field">${['Kommentar','Highlight'].includes(e.type)?'Kommentar':'Zusatztext (optional)'}</label><textarea id="evnote" placeholder="Was ist passiert?" oninput="eventDraft.note=this.value">${esc(e.note)}</textarea><div class="space"></div><button class="bigbtn" onclick="saveEvent(true)">📋 Speichern & Text kopieren</button><div class="space"></div><button class="bigbtn secondary" onclick="saveEvent(false)">Nur speichern</button><div class="help" style="margin-top:13px">Bei „Speichern & Text kopieren“ kannst du den vorbereiteten Text anschließend in euren WhatsApp-Kanal einfügen. Es wird nichts automatisch gesendet.</div>`}
el(`<div class="section-title"><h2>${icon} ${esc(e.type)}</h2><button class="microbtn" onclick="go('game')">✕ Schließen</button></div><div class="wizard-progress"><span class="${eventStep===1?'now':''}">1 · Team</span><span class="${eventStep===2||eventStep===25?'now':''}">2 · Spieler</span><span class="${eventStep===3?'now':''}">3 · Übersicht</span></div><div class="card wizard-card">${body}</div><button class="bigbtn outline" onclick="eventBack()">← Zurück</button>`)}
function saveEvent(copy){const g=game(),e=eventDraft;if(!String(e.minute).trim())return notice('Spielminute fehlt');if(!e.team)return notice('Bitte Mannschaft wählen');if(e.team==='msc'&&e.type==='Wechsel'&&(!e.player||!e.inPlayer))return notice('Bitte beide Spieler für den Wechsel wählen');if(e.team==='msc'&&eventPlayerRequired(e)&&!e.player)return notice('Bitte einen MSC-Spieler wählen');let stored;if(e.id){const idx=g.events.findIndex(x=>x.id===e.id);if(idx>=0){stored={...e,minute:e.minute.trim()};g.events[idx]=stored}}else{stored={...e,id:uid(),order:++g.order,minute:e.minute.trim()};g.events.push(stored)}save();go('game');if(copy&&stored){copyText(eventMsg(g,stored))}else notice('Ereignis gespeichert')}
function deleteEvent(id){if(!confirm('Ereignis wirklich löschen? Der Spielstand wird entsprechend korrigiert.'))return;const g=game();g.events=g.events.filter(e=>e.id!==id);save();gameView();notice('Ereignis gelöscht')}function eventDesc(g,e){if(isPhase(e))return isPhase(e)?`${e.type==='Halbzeit'?'Halbzeitstand':e.type==='Abpfiff'?'Endstand':'Spielstand'}: ${phaseScore(g,e)}`:'';let out='';if(e.team==='msc'&&e.player){const p=playerFromGame(g,e.player);out=p?`${p.number?'#'+p.number+' · ':''}${p.name}`:''}if(e.type==='Wechsel'&&e.team==='msc'&&e.inPlayer){const p=playerFromGame(g,e.inPlayer);out+=` → ${p?.number?'#'+p.number+' · ':''}${p?.name||'Spieler'}`}if(e.note)out+=(out?'\n':'')+e.note;return out||'Spielereignis'}function eventMsg(g,e){if(isPhase(e)){const score=phaseScore(g,e);const match=`${g.home?'MSC':g.opponent} – ${g.home?g.opponent:'MSC'}`;if(e.type==='Anpfiff')return `▶️ ANPFIFF – Die Partie beginnt!\n${match}\nAuf geht’s, MSC! ⚽`;if(e.type==='Halbzeit')return `⏸️ HALBZEIT – ${score}\n${match}\nDie erste Halbzeit ist beendet.`;if(e.type==='Wiederanpfiff')return `▶️ WIEDERANPFIFF – Die 2. Halbzeit läuft!\n${match}\nHalbzeitstand: ${score}`;return `🏁 ABPFIFF – ENDERGEBNIS ${score}\n${match}\nDie Partie ist beendet!`;}const emoji=EVENT_TYPES.find(x=>x[0]===e.type)?.[1]||'⚽';const team=teamName(g,e.team);let txt=`${emoji} ${e.minute}' | ${e.type.toUpperCase()} – ${team}`;let d=eventDesc(g,e);if(d!=='Spielereignis')txt+='\n'+d;if(['Tor','Elfmetertor','Eigentor'].includes(e.type)){const evs=g.events.filter(x=>x.order<=e.order);const mock={...g,events:evs};txt+=`\nSpielstand: ${shownScore(mock).replace(/\s/g,'')}`}return txt}async function copyText(t){try{await navigator.clipboard.writeText(t);notice('Text kopiert – in WhatsApp einfügen')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');notice('Text kopiert')}catch(err){prompt('Text manuell kopieren:',t)}ta.remove()}}function copyEvent(id){const g=game();const e=g.events.find(x=>x.id===id);if(e)copyText(eventMsg(g,e))}function copySummary(){const g=game();const txt=`🏁 MSC ${g.home?'–':'bei'} ${g.opponent}\nEndstand: ${mscScore(g)} (MSC:Gegner)\n\n`+g.events.slice().sort((a,b)=>a.order-b.order).map(e=>eventMsg(g,e)).join('\n\n');copyText(txt)}function help(){alert('MSC Liveticker – Testversion\n\n1. Kader hinterlegen.\n2. Neues Spiel mit Gegner, Startelf und Bank anlegen.\n3. Spieluhr starten und die Ereignisse antippen.\n4. Spielminute und Spieler wählen; Ereignis speichern.\n5. Nachricht im Spielverlauf kopieren und in den WhatsApp-Kanal einfügen.\n\nWichtig: Noch keine zentrale Online-Speicherung! Daten bleiben nur in diesem Browser. Die Beispieleinträge im Kader kannst du löschen.')};render();
</script></body></html>

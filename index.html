function normalizeRows(d){

 return {id:m.id,opponent:m.opponent,date:m.match_date||'',home:m.is_home,teamSize:m.format,halfMinutes:m.half_duration,players,starters,bench,state:m.status||'Vorbereitung',clock:{base:m.clock_seconds||0,since:m.clock_running_since?new Date(m.clock_running_since).getTime():0,running:!!m.clock_running_since},events,order:events.reduce((v,e)=>Math.max(v,e.order),0)};

async function loadCloud(){indicator('Daten werden geladen …');const rows=await fetchCloud();adoptCloud(rows);indicator('✓ Cloud verbunden');view='home';render()}

// V5: Save-only synchronization. Never infer deletions from a partial/local snapshot.
// The old V4 algorithm deleted all DB rows not present in the current browser snapshot.
const BACKUP_KEY='msc_ticker_pending_v5';
function storePending(snapshot, revision){
 try{localStorage.setItem(BACKUP_KEY,JSON.stringify({revision,savedAt:new Date().toISOString(),snapshot}));return true}
 catch(e){indicator('⚠ Lokale Sicherung fehlgeschlagen');alert('Keine lokale Sicherheitskopie möglich: '+e.message+'\nBitte erst Speicherplatz freigeben.');return false}

async function syncSnapshot(snapshot){
 const current=normalizeRows(snapshot),names=['players','matches','match_players','events'];
 for(const table of names){
  const old=synced[table];
  const changed=current[table].filter(row=>Object.keys(row).some(k=>(old[row.id]?.[k]??null)!==(row[k]??null)));
  for(let i=0;i<changed.length;i+=60){
   const batch=changed.slice(i,i+60);
   const res=await db.from(table).upsert(batch).select('id');
   const stored=ensureOk(res,table+' speichern');
   if(!stored||stored.length!==batch.length)throw Error(table+': Keine Speicherbestätigung für alle '+batch.length+' Datensätze');
   Object.assign(synced[table],Object.fromEntries(batch.map(x=>[x.id,x])));
  }
 }
 // Additional server-side readback detects silent data loss / missing rows.
 for(const table of ['match_players','events']){
  const ids=current[table].map(x=>x.id);
  for(let i=0;i<ids.length;i+=100){
   const batch=ids.slice(i,i+100);
   const r=await db.from(table).select('id').in('id',batch);
   const rows=ensureOk(r,table+' überprüfen');
   if(rows.length!==batch.length)throw Error(table+': Es wurden nur '+rows.length+' von '+batch.length+' Einträgen in der Datenbank gefunden');
  }

}
function save(){

  pendingWrites--;syncFailure=true;indicator('⚠ NICHT gespeichert – Sicherung auf Gerät');

let view='home',draft=null,eventDraft=null,eventStep=1,selectedGame=null,editingPlayer=null,toastTimer=null,editLineupDraft=null,lineupSaving=false;function uid(){return crypto.randomUUID()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(s){document.getElementById('main').innerHTML=s}function notice(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}function go(x){view=x;render();window.scrollTo({top:0,behavior:'instant'})}function nav(){document.getElementById('nav').innerHTML=[['home','⌂','Übersicht'],['game','◉','Liveticker'],['new','＋','Neues Spiel'],['roster','♙','Kader']].map(([id,ic,n])=>`<button class="${(id===view||((view==='event'||view==='editlineup')&&id==='game')||(view==='lineup'&&id==='new'))?'active':''}" onclick="go('${id}')"><b>${ic}</b>${n}</button>`).join('')}function game(){return data.games.find(x=>x.id===(selectedGame||data.active))}function teamName(g,team){return team==='msc'?'MSC':g.opponent}function isHome(g,team){return(g.home&&team==='msc')||(!g.home&&team==='opp')}function shownScore(g){let a=0,b=0;for(const e of g.events){if(['Tor','Elfmetertor','Eigentor'].includes(e.type)){const scoring=e.type==='Eigentor'?(e.team==='msc'?'opp':'msc'):e.team;if(scoring==='msc')a++;else b++}}return g.home?`${a} : ${b}`:`${b} : ${a}`}function goalScore(g){let a=0,b=0;for(const e of g.events)if(['Tor','Elfmetertor','Eigentor'].includes(e.type)){const scoring=e.type==='Eigentor'?(e.team==='msc'?'opp':'msc'):e.team;scoring==='msc'?a++:b++}return {a,b}}function mscScore(g){const {a,b}=goalScore(g);return g.home?`${a}:${b}`:`${b}:${a}`}function clockSeconds(g){return (g.clock.base||0)+(g.clock.running?Math.floor((Date.now()-g.clock.since)/1000):0)}function fmtClock(n){let m=Math.floor(Math.max(0,n)/60),s=Math.floor(Math.max(0,n)%60);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function currentMin(g){return Math.max(1,Math.ceil(clockSeconds(g)/60))}function minuteValue(g){return String(currentMin(g))}function rosterPlayer(id){return data.roster.find(p=>p.id===id)}function playerFromGame(g,id){return g.players.find(p=>p.id===id)}function currentOnField(g){const on=new Set(g.starters);const evs=[...g.events].sort((a,b)=>a.order-b.order);for(const e of evs){if(e.type==='Wechsel'&&e.team==='msc'&&e.player&&e.inPlayer){on.delete(e.player);on.add(e.inPlayer)}}return [...on]}function played(g,id){return currentOnField(g).includes(id)}function cloneRoster(ids){return ids.map(id=>{const p=rosterPlayer(id);return p?{...p}:{id,name:'Unbekannt',number:''}})}function render(){if(!signedIn)return;nav();if(view==='home')home();if(view==='roster')roster();if(view==='new')newGame();if(view==='lineup')lineup();if(view==='editlineup')editLineupView();if(view==='game')gameView();if(view==='event')eventView()}function home(){const active=game();el(`<div class="section-title"><h2>Spielzentrale</h2><span class="pill">Online · V7</span></div><div class="card"><div class="eyebrow">${active?'Ausgewähltes Spiel':'Bereit für den Anpfiff'}</div>${active?`<div class="matchline" style="margin:13px 0"><div><b>MSC ${active.home?'–':'bei'} ${esc(active.opponent)}</b><div class="muted">${esc(active.date||'')} · ${esc(active.state)}</div></div><b class="score">${shownScore(active)}</b></div><button class="bigbtn" onclick="go('game')">Spiel öffnen →</button>`:`<h2 style="margin:9px 0 16px">Dein nächstes Spiel</h2><button class="bigbtn" onclick="go('new')">＋ Neues Ticker-Spiel anlegen</button>`}</div><div class="card"><b>So funktioniert's</b><p class="muted" style="line-height:1.65">① Kader einmalig pflegen<br>② Gegner und Startelf festlegen<br>③ Spiel starten und Ereignisse antippen<br>④ WhatsApp-Text kopieren und im Kanal posten</p><div class="help">⚠ Bitte vor dem Schließen auf „✓ In Supabase gespeichert“ achten. Bei einem Speicherfehler wird eine lokale Sicherheitskopie angelegt. Nicht gleichzeitig dasselbe Spiel auf zwei Geräten bearbeiten.</div></div><div class="section-title"><h2>Spielarchiv</h2><span class="tag">${data.games.length} Spiele</span></div>${data.games.length?data.games.slice().reverse().map(g=>`<div class="card"><div class="matchline"><div><b>MSC ${g.home?'–':'bei'} ${esc(g.opponent)}</b><div class="muted">${esc(g.date||'')} · ${esc(g.state)} · ${g.events.length} Ereignisse</div></div><b>${shownScore(g)}</b></div><div class="btnrow" style="margin-top:12px"><button class="microbtn" style="flex:1" onclick="selectGame('${g.id}')">Spiel öffnen</button><button class="microbtn danger" style="flex:0 0 auto;border-color:#e5b4ad" onclick="deleteArchivedGame('${g.id}')">🗑 Löschen</button></div></div>`).join(''):`<div class="empty"><b>📋</b>Noch keine Spiele vorhanden.</div>`}`)}// Archived games are deleted ONLY on explicit confirmation and ONLY after Supabase confirms.
// The foreign keys on match_players and events use ON DELETE CASCADE.
let deletingArchivedGame=false;
async function deleteArchivedGame(id){
 if(deletingArchivedGame)return;
 const g=data.games.find(x=>x.id===id);
 if(!g)return notice('Spiel nicht mehr vorhanden');
 if(pendingWrites||syncFailure||pendingBackup())return alert('Es gibt noch ungesicherte Änderungen. Bitte erst die Speicherung abschließen bzw. die lokale Sicherung wiederherstellen, bevor du ein Spiel löschst.');
 if(g.clock?.running)return alert('Die Spieluhr läuft noch. Bitte das Spiel zuerst anhalten oder beenden, bevor du es löschen kannst.');
 const label='MSC '+(g.home?'– ':'bei ')+g.opponent;
 const ok=confirm('⚠ SPIEL ENDGÜLTIG LÖSCHEN?\n\n'+label+'\n'+(g.date||'Ohne Datum')+'\n'+g.players.length+' Spieler · '+g.events.length+' Ereignisse\n\nDie gesamte Aufstellung, alle Spielereignisse und der Spielstand werden unwiderruflich aus Supabase gelöscht. Der feste MSC-Kader bleibt erhalten.');
 if(!ok)return;
 const typed=prompt('Zur Bestätigung bitte LÖSCHEN eingeben:');
 if(typed!== 'LÖSCHEN'){if(typed!==null)notice('Löschen abgebrochen');return;}
 deletingArchivedGame=true;
 indicator('● Spiel wird gelöscht …');
 try{
  // Ensure any preceding queued synchronization is finished.
  await syncQueue;
  const response=await db.from('matches').delete().eq('id',id).select('id');
  const deleted=ensureOk(response,'Spiel löschen');
  if(!deleted?.some(row=>row.id===id))throw Error('Supabase hat das Löschen nicht bestätigt. Bitte Berechtigungen und Verbindung prüfen.');
  // Verify that the cascade also removed child records.
  const [a,b]=await Promise.all([
   db.from('match_players').select('id').eq('match_id',id).limit(1),
   db.from('events').select('id').eq('match_id',id).limit(1)
  ]);
  if((ensureOk(a,'Aufstellung prüfen')||[]).length||(ensureOk(b,'Ereignisse prüfen')||[]).length){
   throw Error('Das Spiel wurde entfernt, aber zugehörige Daten sind noch vorhanden. Bitte Datenbank prüfen.');
  }
  data.games=data.games.filter(x=>x.id!==id);
  delete synced.matches[id];
  for(const [key,row] of Object.entries(synced.match_players))if(row.match_id===id)delete synced.match_players[key];
  for(const [key,row] of Object.entries(synced.events))if(row.match_id===id)delete synced.events[key];
  for(const key of Object.keys(memberRowIds))if(key.startsWith(id+'_'))delete memberRowIds[key];
  if(selectedGame===id)selectedGame=null;
  if(data.active===id)data.active=data.games.at(-1)?.id||null;
  indicator('✓ Spiel aus Supabase gelöscht');
  home();notice('Spiel endgültig gelöscht');
 }catch(error){
  indicator('⚠ Löschen nicht bestätigt');
  alert('Das Löschen konnte nicht vollständig bestätigt werden.\n\n'+error.message+'\n\nBitte lade die Daten über „Aktualisieren“ neu, bevor du weitere Änderungen machst.');
 }finally{deletingArchivedGame=false}
}
function selectGame(id){selectedGame=id;data.active=id;save();go('game')}function roster(){el(`<div class="section-title"><h2>MSC-Kader</h2><span class="tag">${data.roster.length} Spieler</span></div><div class="card"><div class="muted">Einmalig hinterlegen – beim Erstellen eines Spiels auswählen.</div>${data.roster.map(p=>`<div class="player"><span class="jersey">${esc(p.number||'–')}</span><div class="grow playername">${esc(p.name)}</div><button class="microbtn" onclick="editPlayer('${p.id}')">Ändern</button><button class="microbtn" onclick="removePlayer('${p.id}')">✕</button></div>`).join('')||'<p class="muted">Noch keine Spieler angelegt.</p>'}</div><div class="card"><b id="rosterTitle">Neuen Spieler hinzufügen</b><label class="field">Name</label><input id="pname" placeholder="Vor- und Nachname" autocomplete="off"><label class="field">Rückennummer</label><input id="pnumber" inputmode="numeric" placeholder="z. B. 9"><div class="space"></div><button class="bigbtn" onclick="savePlayer()" id="savep">＋ Spieler speichern</button><button class="bigbtn secondary hidden" style="margin-top:8px" id="cancelp" onclick="editingPlayer=null;roster()">Abbrechen</button></div>`)}function editPlayer(id){const p=rosterPlayer(id);if(!p)return;editingPlayer=id;document.getElementById('pname').value=p.name;document.getElementById('pnumber').value=p.number;document.getElementById('rosterTitle').textContent='Spieler bearbeiten';document.getElementById('savep').textContent='Änderungen speichern';document.getElementById('cancelp').classList.remove('hidden');document.getElementById('pname').focus()}function savePlayer(){const name=document.getElementById('pname').value.trim(),number=document.getElementById('pnumber').value.trim();if(!name)return notice('Bitte einen Spielernamen eingeben');if(editingPlayer){Object.assign(rosterPlayer(editingPlayer),{name,number})}else data.roster.push({id:uid(),name,number});editingPlayer=null;save();roster();notice('Spieler erfasst – Cloud-Speicherung läuft')}function removePlayer(id){if(!confirm('Spieler aus dem aktuellen Kader entfernen? Bereits angelegte Spiele bleiben unverändert.'))return;data.roster=data.roster.filter(p=>p.id!==id);save();roster();notice('Spieler entfernt')}
function newGame(){draft={opponent:'',date:new Date().toISOString().slice(0,10),home:true,selected:[],teamSize:11};el(`<div class="section-title"><h2>Neues Spiel</h2></div><div class="card"><div class="eyebrow">Schritt 1 von 2</div><label class="field">Gegner</label><input id="opp" placeholder="z. B. FC Beispielstadt" autocomplete="off"><label class="field">Datum</label><input type="date" id="date" value="${draft.date}"><label class="field">Spielform und Halbzeitlänge</label><div class="switch" id="sizeSwitch"><button onclick="chooseSize(9)">9 gegen 9 · 40 Min.</button><button onclick="chooseSize(10)">10 gegen 10 · 40 Min.</button><button class="selected" onclick="chooseSize(11)">11 gegen 11 · 45 Min.</button></div><label class="field">Wo spielt der MSC?</label><div class="switch" id="homeSwitch"><button class="selected" onclick="chooseHome(true)">🏠 Heim</button><button onclick="chooseHome(false)">🚌 Auswärts</button></div><div class="space"></div><button class="bigbtn" onclick="nextLineup()">Weiter zur Aufstellung →</button></div><div class="help">Die MSC-Spieler bleiben gespeichert. Du musst vor jedem Spiel nur die Startelf und Ersatzbank festlegen.</div>`)}function chooseSize(n){draft.teamSize=n;document.querySelectorAll('#sizeSwitch button').forEach((b,i)=>b.classList.toggle('selected',[9,10,11][i]===n))}function chooseHome(v){draft.home=v;document.querySelectorAll('#homeSwitch button').forEach((b,i)=>b.classList.toggle('selected',v?i===0:i===1))}function nextLineup(){const opponent=document.getElementById('opp').value.trim();if(!opponent)return notice('Bitte den Gegner eingeben');draft.opponent=opponent;draft.date=document.getElementById('date').value;draft.selected=[];go('lineup')}function lineup(){el(`<div class="section-title"><h2>Aufstellung</h2><span class="pill" id="pickedCount">0 / ${draft.teamSize} Startaufstellung</span></div><div class="card"><div class="eyebrow">Schritt 2 von 2</div><p class="muted">Tippe auf die Spieler. Die ersten ${draft.teamSize} werden als Startaufstellung gewählt; weitere markierte Spieler gehören auf die Ersatzbank. Erneutes Tippen entfernt sie.</p><div id="lineplayers">${linePlayersHtml()}</div></div><div class="card"><div id="lineSummary" class="muted"></div><div class="space"></div><button class="bigbtn" onclick="createGame()">Spiel anlegen ✓</button></div>`);lineRefresh()}function linePlayersHtml(){return data.roster.map(p=>`<button class="pick ${draft.selected.includes(p.id)?'sel':''}" style="width:100%;margin-bottom:7px;display:flex;align-items:center;gap:10px" onclick="toggleLine('${p.id}')"><span class="jersey">${esc(p.number||'–')}</span><span style="flex:1;text-align:left">${esc(p.name)}</span><span class="tag">${draft.selected.includes(p.id)?(draft.selected.indexOf(p.id)<draft.teamSize?'Startelf':'Bank'):'Auswahl'}</span></button>`).join('')}function toggleLine(id){draft.selected=draft.selected.includes(id)?draft.selected.filter(x=>x!==id):[...draft.selected,id];lineRefresh()}function lineRefresh(){document.getElementById('lineplayers').innerHTML=linePlayersHtml();document.getElementById('pickedCount').textContent=`${Math.min(draft.teamSize,draft.selected.length)} / ${draft.teamSize} Startelf`;document.getElementById('lineSummary').textContent=`Startelf: ${Math.min(draft.teamSize,draft.selected.length)} · Ersatzbank: ${Math.max(0,draft.selected.length-draft.teamSize)}`}function createGame(){if(draft.selected.length<draft.teamSize)return notice('Bitte mindestens '+draft.teamSize+' Spieler auswählen');const g={id:uid(),opponent:draft.opponent,date:draft.date,home:draft.home,teamSize:draft.teamSize,halfMinutes:draft.teamSize===11?45:40,players:cloneRoster(draft.selected),starters:draft.selected.slice(0,draft.teamSize),bench:draft.selected.slice(draft.teamSize),state:'Vorbereitung',clock:{base:0,since:0,running:false},events:[],order:0};data.games.push(g);data.active=g.id;selectedGame=g.id;save();go('game');notice('Spiel angelegt – Cloud-Speicherung läuft')}

// Spielkader nachträglich bearbeiten – alle Datenänderungen werden vor einer Löschung bestätigt.
function beginEditLineup(){
 if(pendingWrites||syncFailure||pendingBackup())return alert('Bitte zuerst die offenen Supabase-Speicherungen abschließen oder wiederherstellen.');
 const g=game();if(!g)return;
 editLineupDraft={matchId:g.id, starters:[...g.starters],bench:[...g.bench]};
 go('editlineup');
}
function editLineupView(){
 const d=editLineupDraft,g=game();if(!g||!d||d.matchId!==g.id)return go('game');
 const candidates=[...data.roster,...g.players.filter(p=>!data.roster.some(r=>r.id===p.id))];
 const seen=new Set(),unique=candidates.filter(p=>!seen.has(p.id)&&seen.add(p.id));
 const grouped=(ids,label)=>`<div class="wizard-subhead">${label} (${ids.length})</div>${ids.length?ids.map(id=>{
   const p=unique.find(x=>x.id===id)||playerFromGame(g,id);
   return p?`<div class="player"><span class="jersey">${esc(p.number||'–')}</span><span class="grow playername">${esc(p.name)}</span><button class="microbtn" onclick="setLineupRole('${id}','starting')" ${d.starters.includes(id)?'disabled':''}>Start</button><button class="microbtn" onclick="setLineupRole('${id}','bench')" ${d.bench.includes(id)?'disabled':''}>Bank</button><button class="microbtn" onclick="setLineupRole('${id}','none')">✕</button></div>`:'';
 }).join(''):'<p class="muted">Keine Spieler ausgewählt.</p>'}`;
 const remaining=unique.filter(p=>!d.starters.includes(p.id)&&!d.bench.includes(p.id));
 el(`<div class="section-title"><h2>👥 Spielkader bearbeiten</h2><button class="microbtn" onclick="go('game')">✕ Abbrechen</button></div><div class="card"><b>${esc(g.opponent)}</b><div class="muted">${g.teamSize} gegen ${g.teamSize} · ${g.halfMinutes} Minuten je Halbzeit</div><p class="help">Du kannst Spieler jederzeit hinzufügen und zwischen Startelf und Ersatzbank verschieben. Ereignisse und Spielstand bleiben erhalten. Bereits in Ereignissen verwendete Spieler können nicht entfernt werden.</p><div class="pill" style="margin-top:12px">Startelf: ${d.starters.length} / ${g.teamSize} · Bank: ${d.bench.length}</div>${grouped(d.starters,'Startelf')}${grouped(d.bench,'Ersatzbank')}</div><div class="card"><div class="wizard-subhead">Weitere MSC-Spieler hinzufügen</div>${remaining.length?remaining.map(p=>`<div class="player"><span class="jersey">${esc(p.number||'–')}</span><span class="grow playername">${esc(p.name)}</span><button class="microbtn" onclick="setLineupRole('${p.id}','starting')">Start</button><button class="microbtn" onclick="setLineupRole('${p.id}','bench')">Bank</button></div>`).join(''):'<p class="muted">Alle Spieler sind bereits ausgewählt.</p>'}</div><button id="lineupSaveBtn" class="bigbtn" onclick="saveEditedLineup()" ${lineupSaving?'disabled':''}>${lineupSaving?'Speichert …':'✓ Spielkader speichern'}</button><div class="space"></div><button class="bigbtn outline" onclick="go('game')" ${lineupSaving?'disabled':''}>Ohne Änderungen zurück</button>`);
}
function setLineupRole(id,role){
 if(lineupSaving)return;
 const d=editLineupDraft,g=game();if(!d||!g)return;
 if(role==='none'&&g.events.some(e=>e.player===id||e.inPlayer===id))return alert('Dieser Spieler ist bereits in einem Ticker-Ereignis eingetragen und kann deshalb nicht aus dem Spielkader entfernt werden. Du kannst ihn aber zwischen Startelf und Bank verschieben.');
 d.starters=d.starters.filter(x=>x!==id);d.bench=d.bench.filter(x=>x!==id);
 if(role==='starting'){
  if(d.starters.length>=g.teamSize){d.bench.push(id);notice('Startelf voll – Spieler zunächst auf die Bank gesetzt');}
  else d.starters.push(id);
 }else if(role==='bench')d.bench.push(id);
 editLineupView();
}
async function saveEditedLineup(){
 const d=editLineupDraft,g=game();if(!d||!g||lineupSaving)return;
 if(pendingWrites||syncFailure||pendingBackup())return alert('Offene Speicherungen vorhanden. Bitte erst abschließen.');
 if(d.starters.length!==g.teamSize)return alert(`Für ${g.teamSize} gegen ${g.teamSize} müssen genau ${g.teamSize} Spieler in der Startelf stehen. Aktuell: ${d.starters.length}.`);
 const selected=[...d.starters,...d.bench];
 if(new Set(selected).size!==selected.length)return alert('Ein Spieler ist doppelt ausgewählt.');
 const removed=g.players.filter(p=>!selected.includes(p.id));
 if(removed.some(p=>g.events.some(e=>e.player===p.id||e.inPlayer===p.id)))return alert('Spieler mit bereits erfassten Ereignissen dürfen nicht aus dem Spielkader entfernt werden.');
 if(g.state!=='Vorbereitung'&& !confirm('Das Spiel hat bereits begonnen. Eine nachträgliche Änderung der Startelf kann die Anzeige der aktuell auf dem Platz stehenden Spieler beeinflussen. Trotzdem speichern?'))return;
 lineupSaving=true;editLineupView();indicator('● Speichere Spielkader …');
 const before=deep(g);
 const oldDbRows=Object.values(synced.match_players).filter(row=>row.match_id===g.id);
 const newPlayers=selected.map(id=>data.roster.find(p=>p.id===id)||g.players.find(p=>p.id===id)).filter(Boolean).map(p=>({...p}));
 const staged={...g,players:newPlayers,starters:[...d.starters],bench:[...d.bench]};
 const rows=selected.map((id,i)=>{
  const p=newPlayers.find(x=>x.id===id);
  const key=g.id+'_'+id;
  const rowId=memberRowIds[key]||uid();
  return {id:rowId,match_id:g.id,player_id:id,player_name:p.name,shirt_number:asInt(p.number),role:d.starters.includes(id)?'starting':'bench',on_field:currentOnField(staged).includes(id),order_index:i};
 });
 try{
  // Confirm each new/updated row before removing deselected members.
  if(rows.length){
   const r=await db.from('match_players').upsert(rows).select('id');
   const stored=ensureOk(r,'Spielkader speichern');
   if(stored?.length!==rows.length)throw Error('Nicht alle Spieler wurden bestätigt');
   const verify=await db.from('match_players').select('id').in('id',rows.map(x=>x.id));
   if(ensureOk(verify,'Spielkader überprüfen').length!==rows.length)throw Error('Spielkader ist nicht vollständig in Supabase angekommen');
  }
  // Only rows of THIS match which the user explicitly removed, never delete other match data.
  const selectedIds=new Set(rows.map(r=>r.id));
  const toDelete=oldDbRows.filter(r=>!selectedIds.has(r.id));
  for(const r of toDelete){
   const res=await db.from('match_players').delete().eq('id',r.id).eq('match_id',g.id).select('id');
   if(ensureOk(res,'Entfernten Spieler löschen')?.length!==1)throw Error('Löschen eines Spielers wurde nicht bestätigt');
  }
  // Fetch the authoritative match lineup and verify its exact membership.
  const check=await db.from('match_players').select('*').eq('match_id',g.id);
  const confirmed=ensureOk(check,'Endkontrolle Spielkader');
  if(confirmed.length!==rows.length||!rows.every(row=>confirmed.some(c=>c.id===row.id&&c.role===row.role)))throw Error('Spielkader in Supabase weicht von der Auswahl ab');
  g.players=newPlayers;g.starters=[...d.starters];g.bench=[...d.bench];
  for(const r of oldDbRows)delete synced.match_players[r.id];
  for(const r of confirmed){synced.match_players[r.id]=r;if(r.player_id)memberRowIds[g.id+'_'+r.player_id]=r.id;}
  for(const p of removed)delete memberRowIds[g.id+'_'+p.id];
  editLineupDraft=null;
  indicator('✓ Spielkader in Supabase gespeichert');
  notice('Spielkader gespeichert');go('game');
 }catch(err){
  console.error('Fehler beim Speichern des Spielkaders',err);
  indicator('⚠ Spielkader unvollständig – bitte prüfen');
  alert('Die Änderung konnte nicht vollständig bestätigt werden.\n\n'+err.message+'\n\nBitte die App NICHT neu laden. Die Auswahl bleibt hier sichtbar. Prüfe die Verbindung und versuche es erneut.');
 }finally{lineupSaving=false;if(view==='editlineup')editLineupView();}
}
function gameView(){const g=game();if(!g)return el(`<div class="empty"><b>⚽</b>Kein Spiel ausgewählt.<div class="space"></div><button class="bigbtn" onclick="go('new')">Neues Spiel erstellen</button></div>`);const running=g.clock.running;el(`<div class="card"><div class="eyebrow" style="text-align:center">${esc(g.date)} · ${g.home?'Heimspiel':'Auswärtsspiel'} · ${g.teamSize||11} gegen ${g.teamSize||11} · ${g.halfMinutes||45} Min./Halbzeit</div><div class="matchline" style="text-align:center;margin:15px 0"><div style="flex:1"><b>${g.home?'MSC':esc(g.opponent)}</b></div><div class="score" id="score">${shownScore(g)}</div><div style="flex:1"><b>${g.home?esc(g.opponent):'MSC'}</b></div></div><div style="text-align:center"><span class="pill ${g.state==='Halbzeit'?'orange':''}">${esc(g.state)}</span></div><div class="timer"><strong id="clock">${fmtClock(clockSeconds(g))}</strong><small>${running?'● Uhr läuft':'Ⅱ Uhr angehalten'}</small></div><div class="btnrow">${g.state==='Vorbereitung'?`<button class="bigbtn" onclick="startFirst()">▶ 1. Halbzeit starten</button>`:g.state==='Halbzeit'?`<button class="bigbtn" onclick="startSecond()">▶ 2. Halbzeit starten</button>`:g.state==='Beendet'?`<button class="bigbtn secondary" disabled>Spiel beendet</button>`:`<button class="bigbtn ${running?'secondary':''}" onclick="toggleClock()">${running?'Ⅱ Pausieren':'▶ Fortsetzen'}</button><button class="bigbtn outline" onclick="correctClock()">✎ Uhr ändern</button>`}</div>${['1. Halbzeit','2. Halbzeit'].includes(g.state)?`<div class="space"></div><button class="bigbtn outline" onclick="${g.state==='1. Halbzeit'?'finishHalf()':'finishGame()'}">${g.state==='1. Halbzeit'?'⏸ 1. Halbzeit beenden':'🏁 Spiel beenden'}</button>`:''}</div><div class="card"><div class="matchline"><div><b>👥 Heutiger Spielkader</b><div class="muted">${g.starters.length} Startelf · ${g.bench.length} Ersatzbank</div></div><button class="microbtn" onclick="beginEditLineup()">✎ Kader bearbeiten</button></div></div><div class="section-title"><h2>Ereignis melden</h2><span class="tag">${g.events.length} erfasst</span></div><div class="eventgrid">${EVENT_TYPES.map(([n,icon])=>`<button class="eventbtn" onclick="startEvent('${n}')"><b>${icon}</b>${n}</button>`).join('')}</div><div class="space"></div><div class="section-title"><h2>Spielverlauf</h2><button class="microbtn" onclick="copySummary()">Bericht kopieren</button></div><div class="card">${g.events.length?g.events.slice().sort((a,b)=>Number(b.minute)-Number(a.minute)||b.order-a.order).map(e=>`<div class="timeline"><div class="minute">${esc(e.minute)}'</div><div class="grow"><b>${esc(PHASE_ICONS[e.type]||EVENT_TYPES.find(x=>x[0]===e.type)?.[1]||'⚽')} ${esc(e.type)} · ${esc(teamName(g,e.team))}</b><p>${esc(eventDesc(g,e))}</p><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${isPhase(e)?'':`<button class="microbtn" onclick="editEvent('${e.id}')">Bearbeiten</button>`}<button class="microbtn" onclick="copyEvent('${e.id}')">📋 Kopieren</button><button class="microbtn" onclick="deleteEvent('${e.id}')">Löschen</button></div></div></div>`).join(''):`<div class="empty">Noch keine Spielereignisse erfasst.</div>`}</div><div class="help">📣 Anpfiff, Halbzeit, Wiederanpfiff und Abpfiff erzeugen automatisch eine Meldung und versuchen diese direkt zu kopieren. Du findest sie auch im Spielverlauf. Für andere Ereignisse: Ereignis speichern → „Kopieren“ → WhatsApp-Kanal öffnen → einfügen und senden.</div>`)}function tick(){const g=game();if(view==='game'&&g){const x=document.getElementById('clock');if(x)x.textContent=fmtClock(clockSeconds(g))}}setInterval(tick,350);function startFirst(){const g=game();if(g.state!=='Vorbereitung')return;g.state='1. Halbzeit';g.clock={base:0,since:Date.now(),running:true};addPhase(g,'Anpfiff','1');save();gameView();copyPhase(g)}function toggleClock(){const g=game();if(g.clock.running){g.clock.base=clockSeconds(g);g.clock.running=false}else{g.clock.since=Date.now();g.clock.running=true}save();gameView()}function correctClock(){const g=game();const val=prompt('Spieluhr im Format MM:SS (z. B. 14:30)',fmtClock(clockSeconds(g)));if(val===null)return;const match=val.trim().match(/^(\d{1,3}):(\d{1,2})$/);if(!match||+match[2]>=60)return notice('Bitte MM:SS eingeben');g.clock.base=Number(match[1])*60+Number(match[2]);g.clock.since=Date.now();save();gameView();notice('Spieluhr korrigiert')}function finishHalf(){if(!confirm('1. Halbzeit beenden?'))return;const g=game();g.clock.base=clockSeconds(g);g.clock.running=false;g.state='Halbzeit';addPhase(g,'Halbzeit',String(currentMin(g)));save();gameView();copyPhase(g)}function startSecond(){const g=game();if(g.state!=='Halbzeit')return;g.state='2. Halbzeit';g.clock={base:(g.halfMinutes||45)*60,since:Date.now(),running:true};addPhase(g,'Wiederanpfiff',String((g.halfMinutes||45)+1));save();gameView();copyPhase(g)}function finishGame(){if(!confirm('Spiel jetzt beenden?'))return;const g=game();g.clock.base=clockSeconds(g);g.clock.running=false;g.state='Beendet';addPhase(g,'Abpfiff',String(currentMin(g)));save();gameView();copyPhase(g)}
const PHASE_ICONS={'Anpfiff':'▶️','Halbzeit':'⏸️','Wiederanpfiff':'▶️','Abpfiff':'🏁'};
function isPhase(e){return Object.prototype.hasOwnProperty.call(PHASE_ICONS,e.type)}
function addPhase(g,type,minute){const e={id:uid(),type,team:'msc',minute,player:'',inPlayer:'',note:'',order:++g.order};g.events.push(e);return e}
function copyPhase(g){const e=g.events[g.events.length-1];if(e&&isPhase(e))copyText(eventMsg(g,e))}
function phaseScore(g,e){const evs=g.events.filter(x=>x.order<=e.order);return shownScore({...g,events:evs}).replace(/\s/g,'')}
function startEvent(type){const g=game();if(!g)return notice('Bitte zuerst ein Spiel erstellen');eventDraft={id:null,type,team:null,minute:minuteValue(g),player:'',inPlayer:'',note:''};eventStep=1;go('event')}
function editEvent(id){const e=game()?.events.find(x=>x.id===id);if(!e)return;if(isPhase(e))return notice('Spielphasen lassen sich nicht über die Ereignis-Auswahl bearbeiten');eventDraft={...e};eventStep=3;go('event')}
function eventBack(){if(eventStep===1){go('game');return}if(eventStep===3){eventStep=eventDraft.team==='opp'?1:(eventDraft.type==='Wechsel'?25:2)}else if(eventStep===25){eventStep=2}else eventStep=1;eventView()}
function pickEventTeam(team){eventDraft.team=team;eventDraft.player='';eventDraft.inPlayer='';eventStep=team==='msc'?2:3;eventView()}
function pickEventPlayer(id){eventDraft.player=id;if(eventDraft.type==='Wechsel'){eventDraft.inPlayer='';eventStep=25}else eventStep=3;eventView()}
function pickEventIncoming(id){eventDraft.inPlayer=id;eventStep=3;eventView()}
function eventSkipPlayer(){eventDraft.player='';eventStep=3;eventView()}
function eventPlayerRequired(e){return ['Tor','Elfmetertor','Eigentor','Gelbe Karte','Gelb-Rot','Rote Karte','Wechsel'].includes(e.type)}
function eventView(){const g=game();if(!g||!eventDraft)return go('game');const e=eventDraft;const icon=EVENT_TYPES.find(x=>x[0]===e.type)?.[1]||'⚽';const on=currentOnField(g);const starters=on.map(id=>playerFromGame(g,id)).filter(Boolean);const bench=g.bench.filter(id=>!on.includes(id)).map(id=>playerFromGame(g,id)).filter(Boolean);const playerCards=(arr,handler,selected)=>arr.map(p=>`<button class="wizard-choice ${selected===p.id?'sel':''}" onclick="${handler}('${p.id}')"><span class="jersey">${esc(p.number||'–')}</span><span class="grow" style="text-align:left"><b>${esc(p.name)}</b></span><span class="wizard-chevron">›</span></button>`).join('');let body='';
if(eventStep===1){body=`<div class="wizard-heading">Welche Mannschaft?</div><p class="muted">Tippe auf die Mannschaft, die das Ereignis betrifft.</p><button class="wizard-choice large" onclick="pickEventTeam('msc')"><span class="teammark">MSC</span><span class="grow">MSC</span><span class="wizard-chevron">›</span></button><button class="wizard-choice large" onclick="pickEventTeam('opp')"><span class="teammark away">GAST</span><span class="grow">${esc(g.opponent)}</span><span class="wizard-chevron">›</span></button>`}
else if(eventStep===2){const available=e.type==='Wechsel'?starters:[...starters,...bench];body=`<div class="wizard-heading">Welcher MSC-Spieler?</div><p class="muted">${e.type==='Wechsel'?'Wähle zuerst den Spieler, der den Platz verlässt.':'Wähle einen Spieler aus der heutigen Aufstellung.'}</p><div class="wizard-subhead">${e.type==='Wechsel'?'Auf dem Platz':'Spieler auf dem Platz'}</div>${playerCards(starters,'pickEventPlayer',e.player)}${e.type!=='Wechsel'&&bench.length?`<div class="wizard-subhead">Ersatzbank</div>${playerCards(bench,'pickEventPlayer',e.player)}`:''}${!eventPlayerRequired(e)?`<button class="bigbtn outline" style="margin-top:14px" onclick="eventSkipPlayer()">Ohne Spieler weiter →</button>`:''}`}
else if(eventStep===25){body=`<div class="wizard-heading">Wer wird eingewechselt?</div><p class="muted">Wähle den Spieler von der Ersatzbank.</p>${bench.length?playerCards(bench,'pickEventIncoming',e.inPlayer):'<div class="help">Auf der Ersatzbank ist derzeit kein verfügbarer Spieler.</div>'}`}
else{const pname=e.player?playerFromGame(g,e.player):null;const inname=e.inPlayer?playerFromGame(g,e.inPlayer):null;body=`<div class="wizard-heading">Ereignis überprüfen</div><div class="review-row"><span>Mannschaft</span><b>${esc(teamName(g,e.team))}</b></div><div class="review-row"><span>Ereignis</span><b>${icon} ${esc(e.type)}</b></div>${e.team==='msc'?`<div class="review-row"><span>Spieler</span><b>${pname?esc((pname.number?'#'+pname.number+' · ':'')+pname.name):'Kein Spieler'}</b></div>`:''}${e.type==='Wechsel'&&e.team==='msc'?`<div class="review-row"><span>Eingewechselt</span><b>${inname?esc(inname.name):'–'}</b></div>`:''}<label class="field">Spielminute (änderbar)</label><input id="evminute" inputmode="text" value="${esc(e.minute)}" placeholder="z. B. 10 oder 40+2" oninput="eventDraft.minute=this.value"><label class="field">${['Kommentar','Highlight'].includes(e.type)?'Kommentar':'Zusatztext (optional)'}</label><textarea id="evnote" placeholder="Was ist passiert?" oninput="eventDraft.note=this.value">${esc(e.note)}</textarea><div class="space"></div><button class="bigbtn" onclick="saveEvent(true)">📋 Speichern & Text kopieren</button><div class="space"></div><button class="bigbtn secondary" onclick="saveEvent(false)">Nur speichern</button><div class="help" style="margin-top:13px">Bei „Speichern & Text kopieren“ kannst du den vorbereiteten Text anschließend in euren WhatsApp-Kanal einfügen. Es wird nichts automatisch gesendet.</div>`}
el(`<div class="section-title"><h2>${icon} ${esc(e.type)}</h2><button class="microbtn" onclick="go('game')">✕ Schließen</button></div><div class="wizard-progress"><span class="${eventStep===1?'now':''}">1 · Team</span><span class="${eventStep===2||eventStep===25?'now':''}">2 · Spieler</span><span class="${eventStep===3?'now':''}">3 · Übersicht</span></div><div class="card wizard-card">${body}</div><button class="bigbtn outline" onclick="eventBack()">← Zurück</button>`)}
function saveEvent(copy){const g=game(),e=eventDraft;if(!String(e.minute).trim())return notice('Spielminute fehlt');if(!e.team)return notice('Bitte Mannschaft wählen');if(e.team==='msc'&&e.type==='Wechsel'&&(!e.player||!e.inPlayer))return notice('Bitte beide Spieler für den Wechsel wählen');if(e.team==='msc'&&eventPlayerRequired(e)&&!e.player)return notice('Bitte einen MSC-Spieler wählen');let stored;if(e.id){const idx=g.events.findIndex(x=>x.id===e.id);if(idx>=0){stored={...e,minute:e.minute.trim()};g.events[idx]=stored}}else{stored={...e,id:uid(),order:++g.order,minute:e.minute.trim()};g.events.push(stored)}save();go('game');if(copy&&stored){copyText(eventMsg(g,stored))}else notice('Ereignis erfasst – Cloud-Speicherung läuft')}
async function deleteEvent(id){
 if(!confirm('Ereignis wirklich löschen? Der Spielstand wird entsprechend korrigiert.'))return;
 if(pendingWrites||syncFailure)return alert('Bitte erst offene Speicherfehler beheben, bevor du Ereignisse löschst.');
 const g=game();if(!g)return;
 const original=g.events.find(e=>e.id===id);if(!original)return;
 indicator('● Lösche Ereignis …');
 try{
  const r=await db.from('events').delete().eq('id',id).select('id');
  const result=ensureOk(r,'Ereignis löschen');
  if(result?.length!==1)throw Error('Keine bestätigte Löschung in Supabase');
  delete synced.events[id];
  g.events=g.events.filter(e=>e.id!==id);
  save();gameView();notice('Ereignis gelöscht');
 }catch(e){indicator('⚠ Löschen fehlgeschlagen');alert('Das Ereignis wurde nicht gelöscht: '+e.message)}
}function eventDesc(g,e){if(isPhase(e))return isPhase(e)?`${e.type==='Halbzeit'?'Halbzeitstand':e.type==='Abpfiff'?'Endstand':'Spielstand'}: ${phaseScore(g,e)}`:'';let out='';if(e.team==='msc'&&e.player){const p=playerFromGame(g,e.player);out=p?`${p.number?'#'+p.number+' · ':''}${p.name}`:''}if(e.type==='Wechsel'&&e.team==='msc'&&e.inPlayer){const p=playerFromGame(g,e.inPlayer);out+=` → ${p?.number?'#'+p.number+' · ':''}${p?.name||'Spieler'}`}if(e.note)out+=(out?'\n':'')+e.note;return out||'Spielereignis'}function eventMsg(g,e){if(isPhase(e)){const score=phaseScore(g,e);const match=`${g.home?'MSC':g.opponent} – ${g.home?g.opponent:'MSC'}`;if(e.type==='Anpfiff')return `▶️ ANPFIFF – Die Partie beginnt!\n${match}\nAuf geht’s, MSC! ⚽`;if(e.type==='Halbzeit')return `⏸️ HALBZEIT – ${score}\n${match}\nDie erste Halbzeit ist beendet.`;if(e.type==='Wiederanpfiff')return `▶️ WIEDERANPFIFF – Die 2. Halbzeit läuft!\n${match}\nHalbzeitstand: ${score}`;return `🏁 ABPFIFF – ENDERGEBNIS ${score}\n${match}\nDie Partie ist beendet!`;}const emoji=EVENT_TYPES.find(x=>x[0]===e.type)?.[1]||'⚽';const team=teamName(g,e.team);let txt=`${emoji} ${e.minute}' | ${e.type.toUpperCase()} – ${team}`;let d=eventDesc(g,e);if(d!=='Spielereignis')txt+='\n'+d;if(['Tor','Elfmetertor','Eigentor'].includes(e.type)){const evs=g.events.filter(x=>x.order<=e.order);const mock={...g,events:evs};txt+=`\nSpielstand: ${shownScore(mock).replace(/\s/g,'')}`}return txt}async function copyText(t){try{await navigator.clipboard.writeText(t);notice('Text kopiert – in WhatsApp einfügen')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');notice('Text kopiert')}catch(err){prompt('Text manuell kopieren:',t)}ta.remove()}}function copyEvent(id){const g=game();const e=g.events.find(x=>x.id===id);if(e)copyText(eventMsg(g,e))}function copySummary(){const g=game();const txt=`🏁 MSC ${g.home?'–':'bei'} ${g.opponent}\nEndstand: ${mscScore(g)} (MSC:Gegner)\n\n`+g.events.slice().sort((a,b)=>a.order-b.order).map(e=>eventMsg(g,e)).join('\n\n');copyText(txt)}function help(){alert('MSC Liveticker – Version 6 (Datensicherung)\n\n1. Kader hinterlegen.\n2. Neues Spiel mit Gegner, Startelf und Bank anlegen.\n3. Spieluhr starten und die Ereignisse antippen.\n4. Spielminute und Spieler wählen; Ereignis speichern.\n5. Nachricht im Spielverlauf kopieren und in den WhatsApp-Kanal einfügen.\n\nCloud-Version: Die Daten werden in Supabase gespeichert. Bitte Online-Verbindung beachten.')};boot().catch(e=>showLogin('Verbindungsfehler: '+e.message));
</script></body></html>
